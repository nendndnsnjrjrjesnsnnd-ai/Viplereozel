name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip -q PvPCoreVIP-github.zip
      - run: cd PvPCoreVIP && mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: PvPCoreVIP
          path: PvPCoreVIP/target/PvPCoreVIP-1.0.0.jar
